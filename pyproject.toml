[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-runner-ppo"
version = "0.2.0"
description = "Recurrent PPO for symbolic and exact MazeRunner survival environments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Gabriel Nixon Raj"}]
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.26,<3",
  "pygame>=2.5,<3",
  "stable-baselines3>=2.4,<3",
  "sb3-contrib>=2.4,<3",
  "torch>=2.2",
  "tensorboard>=2.16",
  "tqdm>=4.66",
  "rich>=13.7",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["mazerunner_ppo*"]

[tool.setuptools.package-data]
mazerunner_ppo = ["lib/*.so", "lib/*.dylib", "lib/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
