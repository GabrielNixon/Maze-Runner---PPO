name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Symbolic tests
        run: pytest --ignore=tests/test_exact_env.py
      - name: Build exact backend
        run: python scripts/bootstrap_exact.py
      - name: Exact backend tests
        run: pytest tests/test_exact_env.py
      - name: Validate leaderboard patch
        run: python scripts/prepare_leaderboard_build.py --force
      - name: Validate endless top-10 grinder patch
        run: python scripts/prepare_top10_grinder_build.py --force
